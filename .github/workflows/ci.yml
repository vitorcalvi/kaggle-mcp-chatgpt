name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Validate manifests and scan for secrets
        run: python3 scripts/validate.py
      - name: Smoke test upstream MCP
        run: bash scripts/smoke-test.sh
      - name: Build Docker image
        run: docker build -t kaggle-mcp-chatgpt:ci .
